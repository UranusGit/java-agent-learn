<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Chat · Demo02</title>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Claude 暗色调色板 */
            --bg-primary: #1f1e1d;
            --bg-secondary: #2a2928;
            --bg-tertiary: #333130;
            --bg-hover: #3a3938;
            --bg-input: #2e2d2c;
            --border: #3d3c3b;
            --border-light: #4a4948;
            --text-primary: #f0ede8;
            --text-secondary: #b8b3ac;
            --text-muted: #8a8680;
            --accent: #d97757;          /* Claude 标志性橙 */
            --accent-hover: #c86a4d;
            --accent-soft: rgba(217, 119, 87, 0.12);
            --accent-glow: rgba(217, 119, 87, 0.4);
            --user-bubble: #3d3c3b;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans SC", "PingFang SC", sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Layout ===== */
        .app {
            display: flex;
            height: 100vh;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
        }

        .sidebar-logo .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
        }

        .new-chat-btn {
            margin: 16px;
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 8px;
        }

        .session-list::-webkit-scrollbar { width: 6px; }
        .session-list::-webkit-scrollbar-track { background: transparent; }
        .session-list::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

        .session-item {
            padding: 12px 16px;
            margin: 2px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s ease;
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .session-item:hover { background: var(--bg-tertiary); }

        .session-item.active {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .session-item .session-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }

        .session-item.active .session-dot { background: var(--accent); }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* ===== Main Chat Area ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            min-width: 0;
        }

        /* Toggle button (mobile) */
        .toggle-sidebar {
            display: none;
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 10;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            width: 38px;
            height: 38px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* ===== Messages ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar { width: 8px; }
        .messages-container::-webkit-scrollbar-track { background: transparent; }
        .messages-container::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

        .messages-inner {
            max-width: 780px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 16px;
        }

        .welcome-screen .welcome-icon {
            width: 72px;
            height: 72px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #fff;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .welcome-screen h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .welcome-screen p {
            font-size: 15px;
            color: var(--text-muted);
            max-width: 420px;
            line-height: 1.6;
        }

        .welcome-suggestions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
            width: 100%;
            max-width: 520px;
        }

        .suggestion-card {
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }

        .suggestion-card:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .suggestion-card .suggestion-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-size: 14px;
        }

        /* Message Row */
        .message {
            margin-bottom: 28px;
            display: flex;
            gap: 16px;
            animation: fadeInUp 0.35s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #5b6a76, #475258);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, var(--accent), #b85d3e);
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-role {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .message-body {
            font-size: 15px;
            line-height: 1.75;
            color: var(--text-primary);
            word-wrap: break-word;
        }

        .message-body p { margin-bottom: 8px; }
        .message-body p:last-child { margin-bottom: 0; }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* Cursor blink for streaming */
        .stream-cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s infinite;
            border-radius: 1px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ===== Input Area ===== */
        .input-area {
            padding: 0 24px 20px;
            background: var(--bg-primary);
        }

        .input-inner {
            max-width: 780px;
            margin: 0 auto;
        }

        .input-box {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 4px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            transition: border-color 0.2s ease;
        }

        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: var(--font-sans);
            line-height: 1.5;
            resize: none;
            padding: 12px 4px 12px 16px;
            max-height: 160px;
            min-height: 24px;
        }

        .input-box textarea::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-bottom: 2px;
        }

        .send-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
        .send-btn:disabled { background: var(--bg-hover); color: var(--text-muted); cursor: not-allowed; transform: none; }

        .send-btn svg { width: 18px; height: 18px; }

        .input-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                z-index: 100;
                height: 100%;
                transform: translateX(-100%);
            }

            .sidebar.open { transform: translateX(0); }

            .toggle-sidebar { display: flex; }

            .messages-inner, .input-inner { padding: 0 12px; }

            .welcome-suggestions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Toggle Button -->
        <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>

        <!-- ===== Sidebar ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-icon">✦</div>
                    <span>Chat</span>
                </div>
            </div>
            <button class="new-chat-btn" onclick="newSession()">
                <span style="font-size: 18px;">+</span>
                <span>新对话</span>
            </button>
            <div class="session-list" id="sessionList">
                <!-- sessions populated by JS -->
            </div>
            <div class="sidebar-footer">
                Demo02 · Spring AI + Redis Stream
            </div>
        </aside>

        <!-- ===== Chat Area ===== -->
        <main class="chat-area">
            <div class="messages-container" id="messagesContainer">
                <div class="messages-inner" id="messagesInner">
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">✦</div>
                        <h1>有什么可以帮你的？</h1>
                        <p>Powered by DeepSeek · 基于 Spring AI 流式响应与 Redis Stream 实现的实时对话系统</p>
                        <div class="welcome-suggestions">
                            <div class="suggestion-card" onclick="sendSuggestion('用 Java 写一个快速排序')">
                                <div class="suggestion-title">⌨️ 写代码</div>
                                <div>用 Java 写一个快速排序</div>
                            </div>
                            <div class="suggestion-card" onclick="sendSuggestion('解释一下什么是 Reactor 编程模型')">
                                <div class="suggestion-title">💡 概念解释</div>
                                <div>解释一下什么是 Reactor 编程模型</div>
                            </div>
                            <div class="suggestion-card" onclick="sendSuggestion('帮我写一首关于秋天的诗')">
                                <div class="suggestion-title">✨ 创意写作</div>
                                <div>帮我写一首关于秋天的诗</div>
                            </div>
                            <div class="suggestion-card" onclick="sendSuggestion('Spring Boot 3 有哪些重要新特性？')">
                                <div class="suggestion-title">📖 技术问答</div>
                                <div>Spring Boot 3 有哪些重要新特性？</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== Input ===== -->
            <div class="input-area">
                <div class="input-inner">
                    <div class="input-box">
                        <textarea id="promptInput" placeholder="发送消息给 AI..." rows="1"
                                  onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendPrompt()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="19" x2="12" y2="5"></line>
                                <polyline points="5 12 12 5 19 12"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="input-hint">AI 可能会出错，请核实重要信息 · 按 Enter 发送，Shift+Enter 换行</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ===== State =====
        let currentSessionId = null;
        let isStreaming = false;

        const API_BASE = '/demo02';

        // ===== Session Management =====
        async function loadSessions() {
            try {
                const resp = await fetch(`${API_BASE}/sessions`);
                const text = await resp.text();
                const sessions = text.trim().split('\n').filter(s => s.trim());
                renderSessionList(sessions);

                // 如果没有当前会话且有历史会话，选第一个
                if (!currentSessionId && sessions.length > 0) {
                    // 不自动选中，让用户选择
                }
            } catch (e) {
                console.error('加载会话列表失败:', e);
            }
        }

        function renderSessionList(sessions) {
            const list = document.getElementById('sessionList');
            if (!sessions || sessions.length === 0) {
                list.innerHTML = '<div style="padding:24px 16px;text-align:center;color:var(--text-muted);font-size:13px;">暂无会话</div>';
                return;
            }
            list.innerHTML = sessions.map(sid => {
                const short = sid.length > 20 ? sid.substring(0, 8) + '...' + sid.substring(sid.length - 8) : sid;
                const active = sid === currentSessionId ? 'active' : '';
                return `<div class="session-item ${active}" onclick="selectSession('${sid}')">
                    <div class="session-dot"></div>
                    <span>${short}</span>
                </div>`;
            }).join('');
        }

        async function newSession() {
            if (isStreaming) return;
            try {
                const resp = await fetch(`${API_BASE}/session`, { method: 'POST' });
                const sid = (await resp.text()).trim();
                currentSessionId = sid;
                clearMessages();
                await loadSessions();
            } catch (e) {
                console.error('创建会话失败:', e);
                alert('创建会话失败，请检查后端是否启动');
            }
        }

        function selectSession(sid) {
            if (isStreaming) return;
            currentSessionId = sid;
            clearMessages();
            loadSessions();
            // 切换会话后只清空当前显示，不做历史回放（后端未存储对话文本）
        }

        // ===== Message Rendering =====
        function clearMessages() {
            const inner = document.getElementById('messagesInner');
            inner.innerHTML = getWelcomeHTML();
        }

        function getWelcomeHTML() {
            return `
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">✦</div>
                    <h1>有什么可以帮你的？</h1>
                    <p>Powered by DeepSeek · 基于 Spring AI 流式响应与 Redis Stream 实现的实时对话系统</p>
                    <div class="welcome-suggestions">
                        <div class="suggestion-card" onclick="sendSuggestion('用 Java 写一个快速排序')">
                            <div class="suggestion-title">⌨️ 写代码</div>
                            <div>用 Java 写一个快速排序</div>
                        </div>
                        <div class="suggestion-card" onclick="sendSuggestion('解释一下什么是 Reactor 编程模型')">
                            <div class="suggestion-title">💡 概念解释</div>
                            <div>解释一下什么是 Reactor 编程模型</div>
                        </div>
                        <div class="suggestion-card" onclick="sendSuggestion('帮我写一首关于秋天的诗')">
                            <div class="suggestion-title">✨ 创意写作</div>
                            <div>帮我写一首关于秋天的诗</div>
                        </div>
                        <div class="suggestion-card" onclick="sendSuggestion('Spring Boot 3 有哪些重要新特性？')">
                            <div class="suggestion-title">📖 技术问答</div>
                            <div>Spring Boot 3 有哪些重要新特性？</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function removeWelcome() {
            const ws = document.getElementById('welcomeScreen');
            if (ws) ws.remove();
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 简易 markdown 渲染：代码块、行内代码、加粗、换行
        function renderMarkdown(text) {
            let html = escapeHTML(text);
            // 代码块 ```
            html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
                return `<pre style="background:var(--bg-tertiary);border-radius:10px;padding:16px;overflow-x:auto;margin:8px 0;border:1px solid var(--border);"><code style="font-family:var(--font-mono);font-size:13px;color:var(--text-primary);white-space:pre-wrap;">${code.trim()}</code></pre>`;
            });
            // 行内代码
            html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-family:var(--font-mono);font-size:13px;">$1</code>');
            // 加粗
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // 标题
            html = html.replace(/^### (.+)$/gm, '<h3 style="font-size:16px;font-weight:700;margin:12px 0 6px;">$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2 style="font-size:18px;font-weight:700;margin:12px 0 6px;">$1</h2>');
            // 换行
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function appendMessage(role, content) {
            removeWelcome();
            const inner = document.getElementById('messagesInner');
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const avatar = role === 'user' ? '你' : '✦';
            const roleLabel = role === 'user' ? '你' : 'AI';

            const contentHTML = role === 'user'
                ? `<p>${escapeHTML(content)}</p>`
                : content; // assistant 的 content 已经是渲染好的 HTML

            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-role">${roleLabel}</div>
                    <div class="message-body">${contentHTML}</div>
                </div>
            `;
            inner.appendChild(div);
            scrollToBottom();
            return div;
        }

        function appendTypingIndicator() {
            removeWelcome();
            const inner = document.getElementById('messagesInner');
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typingMessage';
            div.innerHTML = `
                <div class="message-avatar">✦</div>
                <div class="message-content">
                    <div class="message-role">AI</div>
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            inner.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingMessage');
            if (el) el.remove();
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        // ===== Send & Stream =====
        async function sendSuggestion(text) {
            document.getElementById('promptInput').value = text;
            await sendPrompt();
        }

        async function sendPrompt() {
            if (isStreaming) return;

            const input = document.getElementById('promptInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            // 确保有 session
            if (!currentSessionId) {
                await newSession();
                if (!currentSessionId) return;
            }

            // 显示用户消息
            appendMessage('user', prompt);

            // 清空输入框
            input.value = '';
            autoResize(input);

            // 锁定状态
            isStreaming = true;
            updateSendBtn();

            // 显示 typing
            appendTypingIndicator();

            try {
                // 1. 发送 chat 请求 —— 不 await！
                //    后端 /chat 返回 Mono<Void>，HTTP 响应会在整个 AI 生成完成后才返回。
                //    如果 await 它，就等同于"等 AI 写完再开始读"，完全没有流式效果。
                //    所以 fire-and-forget，让 AI 在后台写入 Redis Stream。
                fetch(`${API_BASE}/chat?sessionId=${encodeURIComponent(currentSessionId)}&prompt=${encodeURIComponent(prompt)}`);

                // 2. 轮询获取 runId（chat 发起后，runId 很快被写入 Redis）
                let runId = '';
                for (let i = 0; i < 50; i++) {
                    runId = (await (await fetch(`${API_BASE}/getRunId?sessionId=${encodeURIComponent(currentSessionId)}`)).text()).trim();
                    if (runId) break;
                    await sleep(100);
                }
                if (!runId) throw new Error('获取 runId 超时');

                // 3. 轮询 stream 接口增量拉取 chunk
                await streamResponse(runId);

            } catch (e) {
                console.error('发送失败:', e);
                removeTypingIndicator();
                appendMessage('assistant', `<p style="color:#e57373;">⚠️ 出错了：${escapeHTML(e.message)}</p>`);
            } finally {
                isStreaming = false;
                updateSendBtn();
                removeTypingIndicator();
                loadSessions();
            }
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        /**
         * Long-poll 式接收。
         *
         * 后端 /stream 的 Flux 由 history(Redis Stream) + live(Redis Pub/Sub) 组成，
         * 通过 takeWhile(__END__) 结束。由于 Content-Type 为 application/json，
         * WebFlux 会等整个 Flux 完成后才一次性返回 JSON 数组。
         *
         * 这意味着一次 /stream 请求会**挂住直到 AI 生成完毕**，返回全部 chunk。
         * 但如果请求发出时 AI 还没开始写（runId 刚建立，数据尚未落盘），
         * history 为空 + live 永久等待 → 请求会一直挂着。
         *
         * 策略：用 8 秒超时的 long-poll 反复尝试，拿到数据后用打字机动画逐字展示。
         */
        async function streamResponse(runId) {
            let lastSeq = 0;
            let fullText = '';
            let assistantBody = null;
            let allChunks = [];
            let gotData = false;

            // Phase 1: long-poll 直到拿到所有 chunk
            while (!gotData) {
                // 用 AbortController 设超时，避免请求永久挂住
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 8000);

                try {
                    const resp = await fetch(
                        `${API_BASE}/stream?runId=${encodeURIComponent(runId)}&lastSeq=${lastSeq}`,
                        { signal: controller.signal }
                    );
                    clearTimeout(timeout);

                    if (!resp.ok) {
                        throw new Error(`Stream 请求失败: ${resp.status}`);
                    }

                    const text = await resp.text();
                    if (text.trim()) {
                        try {
                            const chunks = JSON.parse(text);
                            if (chunks.length > 0) {
                                allChunks = chunks;
                                gotData = true;
                            }
                        } catch (e) {
                            // JSON 解析失败，继续重试
                        }
                    }
                } catch (e) {
                    clearTimeout(timeout);
                    if (e.name === 'AbortError') {
                        // 超时，继续重试（AI 可能还在生成中）
                        continue;
                    }
                    throw e;
                }

                if (!gotData) await sleep(300);
            }

            // Phase 2: 逐字打字机动画展示
            for (const chunk of allChunks) {
                const seq = chunk.seq;
                const chunkText = chunk.chunk;
                if (chunkText === '__END__') break;
                if (seq <= lastSeq) continue;
                lastSeq = seq;
                fullText += chunkText;

                // 首次收到数据时，移除 typing 动画，创建 AI 消息气泡
                if (!assistantBody) {
                    removeTypingIndicator();
                    const div = appendMessage('assistant', '');
                    assistantBody = div.querySelector('.message-body');
                }

                // 增量渲染 + 闪烁光标
                assistantBody.innerHTML = renderMarkdown(fullText) + '<span class="stream-cursor"></span>';
                scrollToBottom();

                // 每个 chunk 之间加短暂延迟，模拟打字机效果
                await sleep(20);
            }

            // 移除闪烁光标
            if (assistantBody) {
                const cursor = assistantBody.querySelector('.stream-cursor');
                if (cursor) cursor.remove();
            }
        }

        // ===== UI Helpers =====
        function updateSendBtn() {
            const btn = document.getElementById('sendBtn');
            btn.disabled = isStreaming;
            btn.style.opacity = isStreaming ? '0.5' : '1';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendPrompt();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // ===== Init =====
        window.addEventListener('DOMContentLoaded', () => {
            loadSessions();
        });
    </script>
</body>
</html>
